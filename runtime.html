<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amianto Runtime</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.1/normalize.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#111; color:#eee; }
    #gameCanvas { background:#000; display:block; margin:0 auto; border-radius:8px; }
    .topbar { background:#1a1a1a; border-bottom:1px solid #333; }
  </style>
</head>
<body>
  <div class="topbar py-2 mb-2">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <div>
        <strong>Amianto Runtime</strong>
        <span class="text-muted" id="runtime-project-name"></span>
      </div>
      <div class="btn-group btn-group-sm">
        <button class="btn btn-outline-light" id="btn-restart">Restart</button>
        <button class="btn btn-outline-light" id="btn-exit">Exit</button>
      </div>
    </div>
  </div>

  <div class="container-fluid">
    <div class="row">
      <div class="col-md-9">
        <canvas id="gameCanvas"></canvas>
      </div>
      <div class="col-md-3">
        <div class="mb-2">
          <div class="form-control bg-dark text-light" id="runtime-log" style="height:240px; overflow:auto; font-family: 'Courier New', monospace; font-size: 12px;"></div>
        </div>
        <div class="mb-2">
          <button class="btn btn-success w-100 btn-sm" id="btn-load-json">Load JSON File</button>
        </div>
        <div class="mb-2">
          <button class="btn btn-primary w-100 btn-sm" id="btn-load-last">Load Last Saved (Local)</button>
        </div>
        <div class="mb-2">
          <button class="btn btn-outline-info w-100 btn-sm" id="btn-download-json">Download JSON</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="JS/runtime.js"></script>
  <script>
    // Basic error surface for missing/corrupted game.json when auto-load runs at startup
    window.addEventListener('error', function(e){
      const log = document.getElementById('runtime-log');
      if (log) {
        const t = new Date().toLocaleTimeString();
        log.textContent += `[${t}] Runtime error: ${e.message}\n`;
      }
    });
  </script>
</body>
</html>
