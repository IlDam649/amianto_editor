<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Runtime Sandbox</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- Carica il runtime.js esterno con il sistema migliorato di buffer, retry e fallback -->
  <!-- Usa percorso assoluto dalla root per garantire che funzioni anche quando caricato in iframe -->
  <script>
    // Determina il percorso corretto per runtime.js
    (function() {
      const scripts = document.getElementsByTagName('script');
      let basePath = '';
      
      // Cerca lo script corrente per determinare il percorso base
      for (let i = 0; i < scripts.length; i++) {
        const src = scripts[i].src;
        if (src && src.includes('runtime.html')) {
          // Estrai il percorso base
          const match = src.match(/(.*\/)runtime\.html/);
          if (match) {
            basePath = match[1];
            break;
          }
        }
      }
      
      // Se non trovato, usa percorso relativo standard
      if (!basePath) {
        // Prova a determinare dalla location
        const path = window.location.pathname;
        const lastSlash = path.lastIndexOf('/');
        basePath = lastSlash >= 0 ? path.substring(0, lastSlash + 1) : './';
      }
      
      // Carica runtime.js
      const script = document.createElement('script');
      script.src = basePath + 'JS/runtime.js';
      script.onerror = function() {
        console.error('[Runtime] Failed to load JS/runtime.js from:', script.src);
        console.error('[Runtime] Tried basePath:', basePath);
        console.error('[Runtime] Current location:', window.location.href);
        // Fallback: prova percorso assoluto dalla root
        const fallbackScript = document.createElement('script');
        fallbackScript.src = '/JS/runtime.js';
        fallbackScript.onerror = function() {
          console.error('[Runtime] Fallback path also failed:', fallbackScript.src);
        };
        document.head.appendChild(fallbackScript);
      };
      script.onload = function() {
        console.log('[Runtime] Successfully loaded JS/runtime.js from:', script.src);
      };
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
